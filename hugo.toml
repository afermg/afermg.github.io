    
baseURL = "https://afermg.github.io/"
languageCode = "en-uk"
title = "Alán F. Muñoz's website"

[outputs]
home = ["HTML", "JSON", "RSS"]

[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"
    
[markup.goldmark.renderer]
  unsafe = true

[menu]
main = [
  # {identifier = "Books", name = "Books", url = "/books/"},
  {identifier = "Posts", name = "Posts", url = "/posts/"},
  {identifier = "Search", name = "Search", url = "/search/"},
  {identifier = "Tabs", name = "Tags", url = "/tags/"},
  {identifier = "Categories", name = "Categories", url = "/categories/"},
  {identifier = "RSS", name = "RSS", url = "index.xml"},
  {identifier = "Source", name = "Source", url = "https://github.com/afermg/afermg.github.io"},
  {identifier = "About", name = "About", url = "/about/"},
]

[taxonomies]
tag = 'tags'
categories = 'categories'

[params]
DateFormat = "2006-01-02"
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
env = "production"
social = true
socialIcons = [
  {name = "github", url = "https://github.com/crunchbang"},
  {name = "rss", url = "index.xml"},
]

# [fuseOpts]
# distance = 0
# igNoreLocation = true
# isCaseSensitive = true
# keys = ["title", "permalink", "summary", "content"]
# limit = 10
# minMatchCharLength = 0
# shouldSort = true
# threshold = 0.0

[caches]
  [caches.images]
    dir = ':cacheDir/images'
